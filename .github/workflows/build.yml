name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            artifact: HyraxLimiter-windows
          - os: macos-latest
            name: macos
            artifact: HyraxLimiter-macos
          - os: ubuntu-latest
            name: linux
            artifact: HyraxLimiter-linux

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # The VST3 SDK needs a few X11/dev packages on Linux even with VSTGUI off
      # (the base/hosting utilities reference them).
      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxcb1-dev libxcb-util-dev \
            libxcb-cursor-dev libxcb-keysyms1-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
            libcairo2-dev libgtkmm-3.0-dev libsqlite3-dev libfreetype6-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # The .vst3 bundle location differs slightly per generator; collect any
      # HyraxLimiter.vst3 produced under the build tree.
      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p dist
          found=$(find build -name "HyraxLimiter.vst3" -print -quit)
          if [ -z "$found" ]; then
            echo "HyraxLimiter.vst3 not found"; find build -name "*.vst3"; exit 1
          fi
          # .vst3 is a bundle (directory) on all platforms in this SDK layout.
          cp -R "$found" dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Package per-platform archives
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            (cd "$d" && zip -r "../${name}.zip" .)
          done
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
