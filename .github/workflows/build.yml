name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            artifact: HyraxLimiter-windows
          - os: macos-latest
            name: macos
            artifact: HyraxLimiter-macos
          - os: ubuntu-latest
            name: linux
            artifact: HyraxLimiter-linux

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # The VST3 SDK needs a few X11/dev packages on Linux even with VSTGUI off
      # (the base/hosting utilities reference them).
      - name: Install Linux dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxcb1-dev libxcb-util-dev \
            libxcb-cursor-dev libxcb-keysyms1-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
            libcairo2-dev libgtkmm-3.0-dev libsqlite3-dev libfreetype6-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # Work around vst3sdk naming bugs on Windows:
      # - DLL is output as .vst3 instead of .dll
      # - Architecture folder is x86_64-win instead of x86_64-win64
      - name: Fix Windows bundle naming
        if: matrix.name == 'windows'
        shell: bash
        run: |
          bundle=$(find build -name "HyraxLimiter.vst3" -type d -print -quit)
          # Rename .vst3 files inside the bundle to .dll
          find "$bundle/Contents" -name "*.vst3" -type f -exec sh -c 'mv "$1" "${1%.vst3}.dll"' _ {} \;
          # Rename architecture subdirectory to VST3 spec name
          if [ -d "$bundle/Contents/x86_64-win" ]; then
            mv "$bundle/Contents/x86_64-win" "$bundle/Contents/x86_64-win64"
          fi

      # Self-sign the DLL so Windows/DAWs don't reject the freshly built
      # plugin as unsigned. A self-signed cert isn't a trust anchor (won't
      # quiet SmartScreen on Win11 Smart App Control), but many hosts require
      # the plugin to carry *a* signature to instantiate.
      - name: Sign Windows DLL
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $bundle = (Get-ChildItem -Recurse -Filter "HyraxLimiter.vst3" -Directory).FullName
          $dll = Join-Path $bundle "Contents\x86_64-win64\HyraxLimiter.dll"
          if (-not (Test-Path $dll)) { "DLL not found at $dll"; exit 1 }

          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" | Select-Object -First 1
          if (-not $signtool) { "signtool.exe not found"; exit 1 }

          $password = ConvertTo-SecureString -String "ci-signing-password" -Force -AsPlainText
          $cert = New-SelfSignedCertificate -Type CodeSigningCertificate `
            -Subject "CN=Code of the Geeks, O=Code of the Geeks, C=US" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -KeyExportPolicy Exportable `
            -Extension @{ExtendedKeyUsage = "1.3.6.1.5.5.7.3.3"}
          $pfx = Join-Path $env:TEMP "HyraxLimiter-signing.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password

          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.globalsign.com/scripts/timestamp.dll /td SHA256 /f $pfx /p $password $dll

      # The .vst3 bundle location differs slightly per generator; collect any
      # HyraxLimiter.vst3 produced under the build tree.
      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p dist
          found=$(find build -name "HyraxLimiter.vst3" -print -quit)
          if [ -z "$found" ]; then
            echo "HyraxLimiter.vst3 not found"; find build -name "*.vst3"; exit 1
          fi
          # .vst3 is a bundle (directory) on all platforms in this SDK layout.
          cp -R "$found" dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Package per-platform archives
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            (cd "$d" && zip -r "../${name}.zip" .)
          done
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
